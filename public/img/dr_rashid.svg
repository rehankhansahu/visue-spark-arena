<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2aa85" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="120" />
    </clipPath>
  </defs>

  <!-- Outer Ring with Gold Accent -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="url(#goldRim)" stroke-width="4" />
  
  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#bgGrad)" />
    
    <!-- Subtle Background Glow -->
    <circle cx="128" cy="100" r="70" fill="#6366f1" opacity="0.18" />

    <!-- Academic Professor Portrait -->
    <!-- Shoulders & Suit Coat -->
    <path d="M42 256 C45 205, 80 185, 128 185 C176 185, 211 205, 214 256 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2" />

    <!-- White Shirt Collar & V-Neck -->
    <polygon points="128,218 106,174 150,174" fill="#ffffff" />
    <polygon points="128,218 116,174 128,178 140,174" fill="#f1f5f9" />

    <!-- Necktie -->
    <polygon points="125,178 131,178 133,188 123,188" fill="#5b21b6" />
    <polygon points="124,188 132,188 135,238 128,246 121,238" fill="url(#tieGrad)" />
    <!-- Tie Stripes -->
    <line x1="124" y1="198" x2="132" y2="204" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
    <line x1="123" y1="212" x2="133" y2="218" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
    <line x1="122" y1="226" x2="134" y2="232" stroke="#fbbf24" stroke-width="2" opacity="0.8" />

    <!-- Suit Lapels -->
    <path d="M106 174 L84 256 L112 256 L124 220 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M150 174 L172 256 L144 256 L132 220 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Gold Lapel Pin (Professor / Academic Award) -->
    <circle cx="98" cy="226" r="4.5" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <circle cx="98" cy="226" r="2" fill="#fff" opacity="0.8" />

    <!-- Neck -->
    <rect x="115" y="152" width="26" height="30" rx="4" fill="#db9f7a" />

    <!-- Head / Face -->
    <ellipse cx="128" cy="122" rx="38" ry="46" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="89" cy="124" rx="6" ry="11" fill="#e2aa85" />
    <ellipse cx="167" cy="124" rx="6" ry="11" fill="#e2aa85" />

    <!-- Professional Hair -->
    <path d="M88 116 C88 88, 102 72, 128 72 C154 72, 168 88, 168 116 C168 102, 160 84, 128 84 C96 84, 88 102, 88 116 Z" fill="#1f2937" />
    <path d="M89 116 C89 95, 104 80, 128 80 C146 80, 158 90, 164 100 C156 94, 142 90, 126 91 C108 92, 96 102, 92 116 Z" fill="#111827" />

    <!-- Eyebrows -->
    <path d="M104 108 Q113 104 121 108" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" />
    <path d="M135 108 Q143 104 152 108" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="113" cy="118" rx="4" ry="4" fill="#1e293b" />
    <circle cx="114.5" cy="116.5" r="1.2" fill="#ffffff" />
    <ellipse cx="143" cy="118" rx="4" ry="4" fill="#1e293b" />
    <circle cx="144.5" cy="116.5" r="1.2" fill="#ffffff" />

    <!-- Spectacles / Glasses (Gold Accent Academic Glasses) -->
    <rect x="102" y="110" width="22" height="17" rx="5" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <rect x="132" y="110" width="22" height="17" rx="5" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <!-- Glasses Bridge -->
    <path d="M124 116 Q128 114 132 116" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <!-- Glasses Temples -->
    <path d="M102 116 L90 114" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <path d="M154 116 L166 114" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <!-- Lens reflection -->
    <line x1="106" y1="113" x2="111" y2="123" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <line x1="136" y1="113" x2="141" y2="123" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M128 120 L128 134 L132 136" fill="none" stroke="#c28b69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Friendly Smile -->
    <path d="M118 147 Q128 153 138 147" fill="none" stroke="#9a5a3a" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>